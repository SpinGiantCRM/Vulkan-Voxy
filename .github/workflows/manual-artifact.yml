name: manual-artifact

on: [ workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Check diff whitespace
        run: git diff --check

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Loom Cache
        uses: actions/cache@v5
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew -I init.gradle build

      - name: Select installable mod jar
        id: select_jar
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name "*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-dev.jar" \
              ! -name "*-dev-shadow.jar" \
              | sort
          )

          printf 'Candidate installable jars:\n'
          printf ' - %s\n' "${jars[@]:-}"

          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No installable jar found in build/libs"
            exit 1
          fi

          if [ "${#jars[@]}" -gt 1 ]; then
            echo "Multiple possible installable jars found; refusing to guess."
            exit 1
          fi

          echo "jar=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vulkan-voxy-installable-jar
          path: ${{ steps.select_jar.outputs.jar }}
